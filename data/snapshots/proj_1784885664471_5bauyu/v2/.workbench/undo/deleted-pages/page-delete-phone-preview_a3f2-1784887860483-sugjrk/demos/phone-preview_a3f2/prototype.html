<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手机头图背景预览</title>
  <link rel="stylesheet" href="prototype.css" />
</head>
<body>
  <div class="page">
    <h1 class="title">头图背景预览</h1>
    <div class="tabs">
      <span class="tab active">阅读</span>
      <span class="tab">思维</span>
      <span class="tab">美育</span>
      <span class="tab">英语</span>
      <span class="tab">小作家</span>
    </div>

    <div class="phone-frame">
      <div class="phone-screen">
        <div class="bg-area" style="background: linear-gradient(135deg, #667eea, #764ba2);">
          <div class="overlay">
            <button class="upload-btn">上传头部背景</button>
          </div>
        </div>
        <div class="content-placeholder">
          <div class="line w-full"></div>
          <div class="line w-3/5"></div>
        </div>
      </div>
    </div>

    <div class="note">阅读 - 点击上传头部背景</div>
  </div>
</body>
</html>
