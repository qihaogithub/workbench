<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Export</title>
  <style>
    /* Reset default margins */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    /* Figma export container */
    .figma-export {
      background: white;
      width: 375px;
      height: 812px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="figma-export">
<div data-layer="规则页面" style="width: 375px; height: 812px; position: relative; overflow: hidden">
  <img data-layer="规则配图" style="width: 375px; height: 732px; left: 0px; top: 88px; position: absolute" src="/api/images/img_4doGRk8Hhw-GSQ" />
  <div data-layer="原生/导航&状态" style="left: 0px; top: 0px; position: absolute; background: white; flex-direction: column; justify-content: flex-start; align-items: flex-start; display: inline-flex">
    <div data-layer="原生/状态栏" style="width: 375px; height: 44px; flex-shrink: 0; position: relative">
      <img src="/api/images/img_BqfGt1BmUtauFQ" alt="vector" data-layer="Union" class="Union" style="left: 293.67px; top: 17.33px; position: absolute; width: 67px; height: 11px; object-fit: contain" data-figma-id="9176:68960" />
      <img src="/api/images/img_aIBh00QCyVNL7g" alt="vector" data-layer="↳ Time" class="Time" style="left: 20.60px; top: 16.81px; position: absolute; width: 24px; height: 10px; object-fit: contain" data-figma-id="9176:68961" />
    </div>
    <div data-layer="原生/导航栏" style="width: 375px; height: 44px; flex-shrink: 0; position: relative">
      <div data-layer="功能-左" style="width: 44px; height: 44px; left: 0px; top: 0px; position: absolute">
        <img src="/api/images/img_mEc6U1ff5xf1XQ" alt="vector" data-layer="arrow-back-white (Stroke)" class="ArrowBackWhiteStroke" style="left: 16px; top: 13px; position: absolute; width: 10px; height: 18px; object-fit: contain" data-figma-id="9176:68964" />
      </div>
      <div data-layer="✏️标题" style="width: 272px; height: 25px; left: 51px; top: 9.50px; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--灰-灰---6, #404040); font-size: 18px; font-family: PingFang SC; font-weight: 500; line-height: 27px; word-wrap: break-word">规则</div>
    </div>
  </div>
</div>
  </div>
</body>
</html>
