<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闯关活动 - Figma 设计稿</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="page">
    <!-- 顶部品牌栏 -->
    <div class="top-bar">
      <div class="brand">叫叫明星赛</div>
      <div class="music-btn">
        <svg width="24" height="24" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" stroke="white" stroke-width="2" fill="none"/><path d="M5.67 8.59a1 1 0 011.26-.28l17.7 11.36a1 1 0 01-.28 1.27l-3.3-2.13a4 4 0 11-4.82-6.37l-2.43-1.56v4.04a3 3 0 11-3.75-2.28V13.2l-5.26-3.38a1 1 0 01-.28-1.26zM19.76 8.5a1 1 0 011.06.31v6.06l-2.29-1.47V11.4a30 30 0 00-3.6.39l-3.32-2.13s2.56-.95 8.15-.95z" fill="white"/></svg>
      </div>
      <div class="rules-btn">规则</div>
    </div>

    <!-- 头图区域 -->
    <div class="hero">
      <div class="hero-bg"></div>
      <div class="hero-deco deco-1"></div>
      <div class="hero-deco deco-2"></div>
      <div class="hero-glow"></div>
      
      <!-- 云朵装饰 -->
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      
      <!-- 角色形象区域 -->
      <div class="characters">
        <!-- 左侧章鱼/火箭角色 -->
        <div class="character-left">
          <svg viewBox="0 0 103 114" class="char-svg">
            <path d="M54 9.55s8.36-1.81 8.36-1.51c0 .3 8.99 3.75 10.37 5.59 1.38 1.84 0 5.38 0 5.38s8.25-1.73 11.31-1.73c3.06 0 8.12 2.19 8.52 2.82 1.27 2.67 0 9.77-.5 11.85-.5 2.08-11.84 3.44-11.84 3.44s5.15 2.38 9.85 10.42c4.6 12.38-5.78 19.29-6.03 19.22 7.1 3.99-1.83 14.96-1.83 14.96h3.18s5.74 1.96 7.89 3.39c2.14 1.43 2.85 10.92 0 11.99-2.86 1.07-60.24 13.6-64.46 14.4-3.26.62-8.64-4.52-8.92-5-1.2-2.5 7.62-5.22 7.62-5.22s-3.99-2.15-4.78-7.86c-.8-5.7 6.91-6.69 7.09-6.63-6.77-2.94-11.25-6.95-12.65-11.97-.74-2.64.4-8.77.4-8.77s-4.96 1.84-6.55 2.23c-3.12.94-8.16-3.04-9.28-5-2.37-4.12-2.73-10.45-1.29-12.39 1.48-1.99 8.3-4.53 13.14-5.5 0 0-1.57-6.09-1.66-6.75-.59-4.11.22-5.29 1.66-6.2 1.79-1.11 6.75-2.38 14.9-3.8-.5-4.15-.38-6.89.33-8.21.76-1.41 8.99-3 10.88-3.53 2.46-.93 8.42 1.49 8.53 1.49.11 0 2.12 4.6 2.12 4.6z" fill="none" stroke="url(#charGrad1)" stroke-width="6.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <!-- 右侧玩偶角色 -->
        <div class="character-right">
          <svg viewBox="0 0 91 98" class="char-svg">
            <path d="M4.18 72.24s-1.68-6.75-1.4-12.46c.28-5.71 12.85-5.59 12.84-5.62-2.07-4.23 0-12.21 0-12.21S1.3 36.23 3.2 27.69c1.9-8.53 11.84-22.14 11.84-22.14s4.92-5.47 13.08-1.12c8.16 4.35 9.21 8.65 7.69 10.57.8-.13 27.21-3.63 33.19-3.63 4.54.25 9.93 4.62 9.93 4.62s2.96 12.88-2.84 14.84c-2.5.57-5.12 1.04-5.12 1.04s6.33 3.15 6.79 4.93c.46 1.79 1.64 12.29-2.78 13.48-4.42 1.19-16.03 1.19-16.03 1.19l-1 .4s15.24 1.29 20.98 2.28c-.02.2 4.22 1.3 7.85 4.6 1.21 1.64 1.69 14.11-3.08 15.67-4.77 1.56-24.78 0-24.78 0l-.79 15.23s-2.04 3.87-2.92 4.09c-5.87 1.48-17.9.07-20.7-1.39-4.83-2.52-4.08-16.37-4.08-16.37H8.3" fill="none" stroke="url(#charGrad2)" stroke-width="5.5" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- 星星装饰 -->
      <div class="stars">
        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
        <div class="star s4"></div>
        <div class="star s5"></div>
      </div>
      
      <!-- 参与人数 -->
      <div class="participants">🔥 已有 12,358 人参与</div>
      
      <!-- 底部横幅 -->
      <div class="banner">
        🎁 平板、小天才手表带回家
      </div>
    </div>

    <!-- 内容区域 -->
    <div class="content-area">
      <div class="content-bg"></div>
      
      <!-- 中间装饰角色 -->
      <div class="content-deco">
        <div class="deco-char"></div>
        <div class="deco-bubble"></div>
        <div class="deco-bubble"></div>
      </div>

      <!-- 趣味QQ秀卡片 -->
      <div class="card-qqshow">
        <div class="card-label">趣味QQ秀</div>
      </div>
    </div>
  </div>

  <svg style="position:absolute;width:0;height:0">
    <defs>
      <linearGradient id="charGrad1" x1="-3.53" y1="53.32" x2="32.9" y2="111.89">
        <stop stop-color="#FFB170"/><stop offset="1" stop-color="#FD6713"/>
      </linearGradient>
      <linearGradient id="charGrad2" x1="-6.85" y1="56.27" x2="30.81" y2="99.81">
        <stop stop-color="#FF9F70"/><stop offset="1" stop-color="#FF650E"/>
      </linearGradient>
    </defs>
  </svg>
</body>
</html>
