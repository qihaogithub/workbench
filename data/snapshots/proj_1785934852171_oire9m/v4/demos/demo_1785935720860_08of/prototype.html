<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFlow 介绍 · 团队协作平台</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="pp-slide">
    <div class="bg-glow glow-a"></div>
    <div class="bg-glow glow-b"></div>
    <div class="bg-grid"></div>

    <div class="slide-head">
      <div class="kicker">平台价值</div>
      <h1 class="slide-title">在线、低门槛、面向团队协作的 Agent 平台</h1>
    </div>

    <div class="compare-grid">
      <div class="compare-panel">
        <div class="panel-title bad">传统 Agent 工具</div>
        <div class="panel-item">偏个人提效，需安装工具、配置环境</div>
        <div class="panel-item">命令行 / IDE 使用习惯</div>
        <div class="panel-item">默认 Git、分支、提交协作</div>
        <div class="panel-item">对非开发岗位学习门槛高</div>
        <div class="panel-item">多人协作时上下文难自然共享</div>
      </div>
      <div class="compare-panel good">
        <div class="panel-title">OneFlow</div>
        <div class="panel-item">在线使用，无需安装本地编程工具</div>
        <div class="panel-item">用项目承载对话、页面、配置、资源、预览</div>
        <div class="panel-item">不要求先学 Git</div>
        <div class="panel-item">多角色共享上下文、产物和版本</div>
        <div class="panel-item">把个人 Agent 能力变成团队协作能力</div>
      </div>
    </div>

    <div class="bottom-note">不是把个人编程工具搬进浏览器，而是把 Agent 能力产品化成团队协作平台</div>
  </div>
</body>
</html>
