<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFlow 介绍 · AI 三层作用</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="pp-slide">
    <div class="bg-glow glow-a"></div>
    <div class="bg-glow glow-b"></div>
    <div class="bg-grid"></div>

    <div class="slide-head">
      <div class="kicker">AI 的角色</div>
      <h1 class="slide-title">AI 的三层作用：执行、整合、客服</h1>
    </div>

    <div class="layer-grid">
      <div class="layer-card">
        <div class="layer-icon">⚙️</div>
        <div class="layer-title">自动化执行者</div>
        <div class="layer-items">
          <div class="layer-item">生成活动方案草稿、绘制可交互原型</div>
          <div class="layer-item">整理页面结构、配置项和资源清单</div>
          <div class="layer-item">汇总验收与开发上下文</div>
        </div>
      </div>
      <div class="layer-card">
        <div class="layer-icon">🧠</div>
        <div class="layer-title">知识整合者</div>
        <div class="layer-items">
          <div class="layer-item">整合产品功能知识</div>
          <div class="layer-item">整合 UI 资源规范与历史经验</div>
          <div class="layer-item">整合配置规则与能力边界</div>
        </div>
      </div>
      <div class="layer-card">
        <div class="layer-icon">🛎</div>
        <div class="layer-title">自助客服</div>
        <div class="layer-items">
          <div class="layer-item">「这个活动能不能做」「用哪个功能」</div>
          <div class="layer-item">「这个资源怎么做」</div>
          <div class="layer-item">「这个配置项怎么用」</div>
        </div>
      </div>
    </div>

    <div class="bottom-note">AI 不是一个问答入口，而是活动交付里的执行者、知识中台和一线客服</div>
  </div>
</body>
</html>
