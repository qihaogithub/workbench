<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFlow 介绍 · 为什么需要</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="pp-slide">
    <div class="bg-glow glow-a"></div>
    <div class="bg-glow glow-b orange"></div>
    <div class="bg-grid"></div>

    <div class="slide-head">
      <div class="kicker">现在的痛点</div>
      <h1 class="slide-title">每个活动都在重新做体力活、靠人补上下文</h1>
    </div>

    <div class="two-col">
      <div class="col">
        <div class="col-title">当前的协作链路</div>
        <div class="step-list">
          <div class="step"><span class="num">1</span>策划提出活动目标和玩法</div>
          <div class="step"><span class="num">2</span>人工整理方案、绘制原型、列配置项</div>
          <div class="step"><span class="num">3</span>产品判断系统能力和可复用功能</div>
          <div class="step"><span class="num">4</span>UI 确认页面结构和资源规范</div>
          <div class="step"><span class="num">5</span>运营设计查规范、做素材、等反馈</div>
          <div class="step"><span class="num">6</span>开发重新理解需求、视觉和边界</div>
        </div>
      </div>
      <div class="col">
        <div class="col-title">核心成本</div>
        <div class="cost-list">
          <div class="cost">⏱ 原型绘制、配置清单、文档同步占用大量时间</div>
          <div class="cost">🧩 策划不了解完整产品能力</div>
          <div class="cost">💬 产品反复承担功能咨询角色</div>
          <div class="cost">📄 UI 资源规范分散在文档中</div>
          <div class="cost">🔀 运营设计要在多个文档和原型间切换</div>
          <div class="cost">🔧 开发接入时重新理解大量上下文</div>
        </div>
      </div>
    </div>

    <div class="conclusion-bar">
      问题不是「谁不够努力」，而是：重复执行靠人 · 知识整合靠会 · 常规咨询靠人肉响应
    </div>
  </div>
</body>
</html>
