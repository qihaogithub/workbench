<div class="page" data-bind-style-background-color="bgColor" data-bind-style-color="textColor">
  <div class="header">
    <img data-bind-src="logo" class="logo" />
    <h1>{{title}}</h1>
    <p class="subtitle">{{subtitle}}</p>
  </div>
  <div class="status-bar">
    <span class="badge">布局: {{layout}}</span>
    <span class="badge">横幅: {{showBanner}}</span>
  </div>
  <div class="preview-note">
    <p>背景色 {{bgColor}} / 文字色 {{textColor}}</p>
  </div>
</div>
