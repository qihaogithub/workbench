<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Export</title>
  <style>
    /* Reset default margins */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    /* Figma export container */
    .figma-export {
      background: white;
      width: 375px;
      height: 812px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="figma-export">
<div data-layer="闯关开场" style="width: 375px; height: 812px; position: relative; background: white; overflow: hidden">
  <img data-layer="背景" style="width: 375px; height: 812px; left: 0.50px; top: 0.50px; position: absolute" src="/api/images/img_P_9L7QAwRJyvag" alt="童年大作战闯关活动开场海报，灰度风格，含趣味QQ秀、森林躲猫猫、读古诗赢大奖等玩法入口" />
  <div data-layer="遮罩" style="width: 376px; height: 812px; left: 0px; top: 0px; position: absolute; opacity: 0.70; background: black"></div>
  <img data-layer="弹窗图片" style="width: 375px; height: 375px; left: 0px; top: 218px; position: absolute" src="/api/images/img_5dVk-_aTCmGiCQ" />
</div>
  </div>
</body>
</html>
