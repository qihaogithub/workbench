<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词王者：连胜登顶大挑战</title>
</head>
<body>
<main class="scene">

  <!-- 天空与云雾背景 -->
  <div class="sky" aria-hidden="true">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="fog fog-a"></div>
    <div class="fog fog-b"></div>
    <div class="beams"></div>
  </div>

  <!-- 顶端绿洲/宝藏 -->
  <div class="summit" aria-hidden="true">
    <div class="flag"></div>
  </div>

  <!-- 王者天梯 -->
  <div class="ladder" aria-hidden="true">
    <div class="rail rail-left"></div>
    <div class="rail rail-right"></div>
    <div class="step step-1"></div>
    <div class="step step-2"></div>
    <div class="step step-3"></div>
    <div class="step step-4"></div>
    <div class="step step-5"></div>
    <div class="step step-6"></div>
    <!-- 绿豆角色 -->
    <div class="bean">
      <div class="bean-body"></div>
      <div class="bean-arm arm-left"></div>
      <div class="bean-arm arm-right"></div>
    </div>
  </div>

  <!-- 文案区 -->
  <header class="hero">
    <p class="slogan">集结！为荣誉而战</p>
    <h1 class="title">单词王者：连胜登顶大挑战</h1>
    <p class="subtitle">每日充能，解锁PK特权，冲顶排行榜！</p>
  </header>

  <!-- 按钮区 -->
  <footer class="actions">
    <button class="btn btn-primary" type="button">注&nbsp;入&nbsp;燃&nbsp;料</button>
    <p class="hint">今日还有 PK 机会待领取</p>
    <button class="btn btn-ghost" type="button">去学习 · 获得燃料</button>
    <button class="btn btn-disabled" type="button" disabled>今日已加速 · 明日再来</button>
  </footer>

</main>
</body>
</html>
