<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宫殿大门：开启魔力竞技场</title>
</head>
<body>
<main class="scene">

  <!-- 背景 -->
  <div class="bg" aria-hidden="true">
    <span class="sparkle" style="top:8%;left:14%"></span>
    <span class="sparkle" style="top:16%;left:78%"></span>
    <span class="sparkle" style="top:6%;left:48%;animation-delay:1s"></span>
    <span class="sparkle" style="top:24%;left:30%;animation-delay:1.5s"></span>
    <div class="vines v1"></div>
    <div class="vines v2"></div>
  </div>

  <!-- 大门视觉 -->
  <div class="gate-wrap" aria-hidden="true">
    <div class="gate">
      <span class="gate-arch"></span>
      <div class="chain"></div>
      <div class="door">
        <div class="door-leaf"></div>
        <div class="door-leaf"></div>
      </div>
      <div class="flash"></div>
    </div>
    <!-- 悬浮钥匙 -->
    <div class="key">
      <span class="key-bow"></span>
      <span class="key-shaft"></span>
      <span class="key-tooth"></span>
    </div>
  </div>

  <!-- 文案 -->
  <header class="hero">
    <p class="eyebrow">魔法钥匙 · 荣誉之门</p>
    <h1 class="title">宫殿大门</h1>
    <p class="subtitle">完课 1 次，获得开启机会 x3<br>擦亮钥匙，解锁魔法竞技场</p>
  </header>

  <!-- 按钮 -->
  <footer class="actions">
    <button class="btn btn-primary" type="button">擦&nbsp;亮&nbsp;钥&nbsp;匙</button>
    <p class="hint">已获开启机会 x3</p>
    <button class="btn btn-ghost" type="button">前往学习 · 获取机会</button>
    <button class="btn btn-disabled" type="button" disabled>已开启 · 明日再来</button>
  </footer>

</main>
</body>
</html>
