<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词魔塔：为塔充能</title>
</head>
<body>
<main class="scene">

  <!-- 背景 -->
  <div class="bg" aria-hidden="true">
    <div class="stars">
      <span class="star" style="top:6%;left:12%"></span>
      <span class="star" style="top:14%;left:82%"></span>
      <span class="star" style="top:22%;left:40%;animation-delay:1s"></span>
      <span class="star" style="top:10%;left:55%;animation-delay:.5s"></span>
      <span class="star" style="top:30%;left:24%;animation-delay:2s"></span>
    </div>
    <div class="moon"></div>
  </div>

  <!-- 魔塔视觉 -->
  <div class="tower-wrap" aria-hidden="true">
    <div class="energy">
      <div class="energy-bar"><div class="energy-fill"></div></div>
      <p class="energy-label">魔塔能量</p>
    </div>
    <div class="tower">
      <div class="crest"></div>
    </div>
    <div class="monster monster-1">
      <div class="m-body"></div>
      <span class="m-eye"></span>
      <span class="m-eye eye-b"></span>
    </div>
    <div class="monster monster-2">
      <div class="m-body"></div>
      <span class="m-eye"></span>
      <span class="m-eye eye-b"></span>
    </div>
  </div>

  <!-- 文案 -->
  <header class="hero">
    <p class="eyebrow">充能勇者 · 集结出征</p>
    <h1 class="title">单词魔塔</h1>
    <p class="subtitle">击退"懒懒兽"，为整座竞技大陆供能<br>完成本节单词，注入核心能量</p>
  </header>

  <!-- 按钮 -->
  <footer class="actions">
    <button class="btn btn-primary" type="button">注&nbsp;入&nbsp;能&nbsp;量</button>
    <p class="hint">灌注能量 · 爆出 PK 密钥</p>
    <button class="btn btn-ghost" type="button">前往魔塔规则</button>
    <button class="btn btn-disabled" type="button" disabled>今日能量已满 · 明日再来</button>
  </footer>

</main>
</body>
</html>
