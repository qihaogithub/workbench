<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFlow 介绍 · 运营设计视角</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="pp-slide">
    <div class="bg-glow glow-a"></div>
    <div class="bg-glow glow-b orange"></div>
    <div class="bg-grid"></div>

    <div class="slide-head">
      <div class="kicker">运营设计师视角</div>
      <h1 class="slide-title">从「交付切图」到「上传资源并实时验证效果」</h1>
    </div>

    <div class="flow-steps">
      <div class="fstep"><span class="fnum">1</span>查看全部页面与配置项</div>
      <div class="farrow">→</div>
      <div class="fstep"><span class="fnum">2</span>查看每个资源的规范说明</div>
      <div class="farrow">→</div>
      <div class="fstep"><span class="fnum">3</span>上传图片、动效、音效素材</div>
      <div class="farrow">→</div>
      <div class="fstep"><span class="fnum">4</span>在真实页面实时预览</div>
      <div class="farrow">→</div>
      <div class="fstep"><span class="fnum">5</span>按预览调整素材或配置</div>
      <div class="farrow">→</div>
      <div class="fstep"><span class="fnum">6</span>完成配置验收</div>
    </div>

    <div class="op-grid">
      <div class="op-col">
        <div class="op-title">过去</div>
        <div class="op-item">规范按功能分散在多份文档中</div>
        <div class="op-item">需要打开多份文档查尺寸和状态</div>
        <div class="op-item">规范说明与真实页面效果分离</div>
      </div>
      <div class="op-col highlight">
        <div class="op-title">OneFlow</div>
        <div class="op-item">规范按活动页面和配置项组织</div>
        <div class="op-item">每个配置项有备注、尺寸、格式、状态和说明</div>
        <div class="op-item">上传资源后可在真实页面中预览</div>
      </div>
    </div>

    <div class="bottom-note">要看的不是一堆通用规范，而是本次活动要做什么、怎么做、效果怎样</div>
  </div>
</body>
</html>
