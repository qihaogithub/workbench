<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFlow 介绍 · 中心产物</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="pp-slide">
    <div class="bg-glow glow-a"></div>
    <div class="bg-glow glow-b"></div>
    <div class="bg-grid"></div>

    <div class="slide-head">
      <div class="kicker">中心产物</div>
      <h1 class="slide-title">AI 生成的可交互活动原型，是一份「活动执行说明书」</h1>
    </div>

    <div class="hub-layout">
      <div class="hub-side">
        <div class="hub-node">📋 正式文案</div>
        <div class="hub-node">🖥 所有活动页面</div>
        <div class="hub-node">⚙️ 页面配置项</div>
      </div>
      <div class="hub-center">
        <div class="hub-core">可交互<br>活动原型</div>
        <div class="hub-cap">贯穿策划 · 产品 · UI · 运营 · 开发</div>
      </div>
      <div class="hub-side">
        <div class="hub-node">📦 资源清单</div>
        <div class="hub-node">📐 尺寸 / 格式 / 状态 / 规范</div>
        <div class="hub-node">👀 上传资源后的预览效果</div>
      </div>
    </div>

    <div class="bottom-note">原型不再只是手工草图，而是 AI 整合知识后生成的、所有角色都能使用的共同语言</div>
  </div>
</body>
</html>
