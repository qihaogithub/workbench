<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFlow 介绍 · 完整闭环</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="pp-slide">
    <div class="bg-glow glow-a"></div>
    <div class="bg-glow glow-b"></div>
    <div class="bg-grid"></div>

    <div class="slide-head">
      <div class="kicker">完整闭环</div>
      <h1 class="slide-title">一次活动在 OneFlow 里的完整闭环</h1>
    </div>

    <div class="loop-layout">
      <div class="loop-steps">
        <div class="loop-step"><span class="lnum">1</span>产品与 UI 维护模板、功能知识、资源规范</div>
        <div class="loop-step"><span class="lnum">2</span>策划输入活动目标、玩法、节奏与投放诉求</div>
        <div class="loop-step"><span class="lnum">3</span>AI 整合产品能力、UI 规范与历史经验</div>
        <div class="loop-step"><span class="lnum">4</span>AI 生成方案建议与可交互活动原型</div>
        <div class="loop-step"><span class="lnum">5</span>沉淀页面、文案、配置项、资源清单与规范</div>
        <div class="loop-step"><span class="lnum">6</span>多角色在线协作，无需安装工具或学习 Git</div>
        <div class="loop-step"><span class="lnum">7</span>运营设计查规范、上传资源并实时预览</div>
        <div class="loop-step"><span class="lnum">8</span>必要时通过 Vibe Coding 产出高保真页面</div>
        <div class="loop-step"><span class="lnum">9</span>开发通过 CLI 获取完整上下文并接入</div>
        <div class="loop-step"><span class="lnum">10</span>验收、上线，新能力沉淀回模板与知识库</div>
      </div>
      <div class="loop-center">
        <div class="loop-ring">🔄</div>
        <div class="loop-center-text">一次活动<br>反哺下一次活动</div>
      </div>
    </div>

    <div class="cta-bar">
      🚀 选择一个真实活动，跑通从策划方案到上线复盘的第一条 OneFlow 工作流
    </div>
  </div>
</body>
</html>
