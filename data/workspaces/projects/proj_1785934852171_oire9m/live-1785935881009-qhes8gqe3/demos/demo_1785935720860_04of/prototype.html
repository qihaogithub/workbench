<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneFlow 介绍 · 角色变化</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="pp-slide">
    <div class="bg-glow glow-a"></div>
    <div class="bg-glow glow-b"></div>
    <div class="bg-grid"></div>

    <div class="slide-head">
      <div class="kicker">角色之变</div>
      <h1 class="slide-title">不是替代角色，而是把人从重复执行中释放出来</h1>
    </div>

    <div class="role-grid">
      <div class="role-card">
        <div class="role-icon">🎯</div>
        <div class="role-name">活动策划</div>
        <div class="role-change">从提出需求、等待支持</div>
        <div class="role-arrow">↓</div>
        <div class="role-result">借助 AI 生成可落地方案、原型与配置清单</div>
      </div>
      <div class="role-card">
        <div class="role-icon">🧩</div>
        <div class="role-name">产品经理</div>
        <div class="role-change">从功能客服</div>
        <div class="role-arrow">↓</div>
        <div class="role-result">维护模板、功能知识、能力边界与验收规则</div>
      </div>
      <div class="role-card">
        <div class="role-icon">🎨</div>
        <div class="role-name">UI 设计师</div>
        <div class="role-change">从规范客服</div>
        <div class="role-arrow">↓</div>
        <div class="role-result">维护视觉规范、页面结构与资源标准</div>
      </div>
      <div class="role-card">
        <div class="role-icon">🖼</div>
        <div class="role-name">运营设计师</div>
        <div class="role-change">从查分散规范、反复确认</div>
        <div class="role-arrow">↓</div>
        <div class="role-result">向 AI 查规范、上传资源、实时预览影响效果</div>
      </div>
      <div class="role-card">
        <div class="role-icon">🔧</div>
        <div class="role-name">开发者</div>
        <div class="role-change">从重新理解需求与视觉</div>
        <div class="role-arrow">↓</div>
        <div class="role-result">读取项目代码、配置协议与完整上下文</div>
      </div>
    </div>

    <div class="bottom-note">AI 承接执行和问答 · 人负责沉淀标准、判断边界和处理例外</div>
  </div>
</body>
</html>
