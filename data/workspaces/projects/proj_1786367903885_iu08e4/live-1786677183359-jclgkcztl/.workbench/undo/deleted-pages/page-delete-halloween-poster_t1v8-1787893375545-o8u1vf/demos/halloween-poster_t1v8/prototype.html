<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成就海报生成 · 分享</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="wf-container">

    <!-- 顶部 -->
    <header class="wf-topbar">
      <span class="wf-topbar-step">🎉 寻回成功</span>
      <span class="wf-topbar-hint">生成成就海报</span>
    </header>

    <!-- 成功语 -->
    <section class="wf-success">
      <h1 class="wf-success-title">我是南瓜小侦探！</h1>
      <p class="wf-success-sub">我帮精灵回家啦！</p>
      <p class="wf-success-share">来叫叫赢好礼，万圣节英语大闯关！</p>
    </section>

    <!-- 海报预览 -->
    <section class="wf-poster">
      <div class="wf-poster-frame">
        <div class="wf-poster-title">南瓜精灵失踪记</div>

        <!-- 精灵团聚区 -->
        <div class="wf-poster-sprites">
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite">🎃</div>
          <div class="wf-sprite wf-sprite-focus">🎃</div>
        </div>
        <span class="wf-poster-sprite-note">10 个南瓜精灵全部寻回 · 感谢信</span>

        <!-- 勋章区 -->
        <div class="wf-poster-badge">
          <span class="wf-badge-title">南瓜侦探</span>
          <div class="wf-badge-icons">🏅🏅🏅🏅🏅</div>
          <span class="wf-badge-note">5 枚勋章拼成「南瓜侦探」</span>
        </div>

        <!-- 单词树 -->
        <div class="wf-poster-words">
          <h4>学会 12 个单词</h4>
          <div class="wf-poster-word-tags">
            <span>trick</span><span>treat</span><span>witch</span><span>ghost</span>
            <span>monster</span><span>bat</span><span>spider</span><span>pumpkin</span>
            <span>candy</span><span>one</span><span>two</span><span>little</span>
          </div>
        </div>

        <!-- 跟唱截图 -->
        <div class="wf-poster-song">
          <div class="wf-song-thumb">🎶</div>
          <div class="wf-song-info">
            <p class="wf-song-title">Ten Little Pumpkins</p>
            <p class="wf-song-sub">跟唱作品截图 / 视频封面</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 操作区 -->
    <section class="wf-actions">
      <button class="wf-btn wf-btn-primary">生成我的成就海报</button>
      <button class="wf-btn wf-btn-outline">保存到相册</button>
      <button class="wf-btn wf-btn-outline">分享到朋友圈</button>
      <p class="wf-actions-hint">分享朋友圈集赞，赢取分享福利奖</p>
    </section>

  </div>
</body>
</html>
