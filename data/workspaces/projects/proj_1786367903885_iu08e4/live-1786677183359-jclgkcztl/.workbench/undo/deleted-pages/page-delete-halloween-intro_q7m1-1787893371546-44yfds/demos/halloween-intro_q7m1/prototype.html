<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南瓜精灵失踪记 · 线索引入</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <div class="wf-container">

    <!-- 顶部进度提示 -->
    <header class="wf-topbar">
      <span class="wf-topbar-step">任务引入</span>
      <span class="wf-topbar-hint">寻找南瓜精灵</span>
    </header>

    <!-- 开场动画占位 -->
    <section class="wf-scene">
      <div class="wf-scene-illust">
        <div class="wf-scene-dark-bg"></div>
        <div class="wf-pumpkin-ghost">🎃</div>
        <span class="wf-scene-note">SPINE 动画占位 · 一个弹出的南瓜逐渐消失的身影…</span>
      </div>

      <!-- Domi 出镜 -->
      <div class="wf-domi-pop">
        <div class="wf-domi-avatar">🦖</div>
        <div class="wf-domi-bubble">
          <span class="wf-domi-name">Domi</span>
          <p>一脸问号 · 正在寻找线索</p>
        </div>
      </div>
    </section>

    <!-- 危机文字 · 一个个敲击 -->
    <section class="wf-story">
      <h1 class="wf-story-title">紧急大事！</h1>
      <p class="wf-story-line">南瓜精灵在万圣节前失踪！</p>
      <p class="wf-story-line">请你化身小侦探，完成闯关，找回失踪的精灵！</p>
      <div class="wf-typing-note">（文字逐字敲击动画占位）</div>
    </section>

    <!-- 落版按钮 -->
    <section class="wf-cta-wrap">
      <button class="wf-btn wf-btn-primary">开始挑战</button>
      <p class="wf-cta-hint">先了解万圣节，再出发寻找精灵</p>
    </section>

    <!-- 底部进度 -->
    <footer class="wf-footer-mini">
      <p>线索引入 · 即将进入第 1 关</p>
    </footer>

  </div>
</body>
</html>
