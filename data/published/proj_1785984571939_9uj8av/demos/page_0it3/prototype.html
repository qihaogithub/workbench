    /* Reset default margins */
    * {
      margin: 0;

    /* Figma export container */
    .figma-export {
      background: white;
      width: 375px;
      height: 812px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      position: relative;

    .scrollable-content {
      width: 375px;
      height: 812px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 90px;
      -webkit-overflow-scrolling: touch;
    }
    
    /* 隐藏滚动条 */
    .scrollable-content::-webkit-scrollbar {
      display: none;
    }
    
    /* 吸底标签栏 */
    .bottom-tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 375px;
      height: 90px;
      z-index: 100;
    }
    
    /* 头部固定 */
    .fixed-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 375px;
      height: 132px;
      z-index: 100;
    }
  </style>
</head>
