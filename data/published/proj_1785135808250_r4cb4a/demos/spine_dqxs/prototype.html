<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Export</title>
  <style>
    /* Reset default margins */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    /* Figma export container */
    .figma-export {
      background: white;
      width: 375px;
      height: 812px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="figma-export">
<div data-layer="获得卡片-spine" class="Spine" style="width: 375px; height: 812px; position: relative; background: white; overflow: hidden">
  <div data-layer="遮罩" style="width: 376px; height: 812px; left: 0px; top: 0px; position: absolute; opacity: 0.70; background: black"></div>
  <div data-layer="Frame 3465421" class="Frame3465421" style="left: 0px; top: 123.50px; position: absolute; flex-direction: column; justify-content: flex-start; align-items: center; gap: 20px; display: inline-flex">
    <div data-layer="获得卡片样式" style="width: 375px; height: 500px; flex-shrink: 0; position: relative; background: #DBDBDB">
      <div data-layer="获得卡片动画" style="left: 73px; top: 220.50px; position: absolute; opacity: 0.11; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: black; font-size: 38.50px; font-family: SF Pro Rounded; font-weight: 700; line-height: 57.75px; white-space: nowrap">获得卡片动画</div>
    </div>
    <div data-layer="常规按钮" data-主次="主按钮" data-大小="H44*W132" data-状态="默认" style="width: 132px; height: 44px; flex-shrink: 0; position: relative; background: #FCDA00; border-radius: 30px">
      <div data-layer="开始学习" style="left: 48px; top: 8.50px; position: absolute; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--主-黄---6, #544300); font-size: 18px; font-family: PingFang SC; font-weight: 500; line-height: 27px; white-space: nowrap">收下</div>
    </div>
  </div>
</div>
  </div>
</body>
</html>
